name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install QML tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-declarative-dev-tools
      - name: Check source
        run: ./scripts/check-portable
